[package]
name = "picoo-desktop"
description = "Windows/macOS GPUI Receiver desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "picoo-desktop"
path = "src/main.rs"

[features]
default = []
gpui-ui = ["dep:windows", "dep:gpui-kit"]
windows-vcam = ["dep:windows", "picoo-receiver/windows-mf"]
loopback-diagnostics = ["picoo-receiver/loopback-diagnostics"]

[dependencies]
anyhow = "1"
picoo-discovery.workspace = true
picoo-diagnostics.workspace = true
picoo-frame-hub.workspace = true
picoo-pairing.workspace = true
picoo-protocol.workspace = true
picoo-metrics.workspace = true
picoo-receiver.workspace = true
picoo-session.workspace = true
picoo-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

futures-channel = "0.3"
gpui-kit = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-video = "0.5.2"
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
dispatch2 = "0.3.1"
libc = "0.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSError",
    "NSArray",
    "NSObject",
    "NSString",
] }
objc2-system-extensions = "0.3.2"

[dev-dependencies]
bytes.workspace = true
picoo-media-decode = { path = "../../crates/picoo-media-decode", features = ["test-codecs"] }

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
picoo-gpu.workspace = true

name: Apple Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: CFBundleShortVersionString（例如 1.2.0）
        required: true
        type: string
      build_number:
        description: 递增的 CFBundleVersion 正整数
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: apple-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-26
    environment: apple-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Resolve monotonically increasing bundle version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            release_build="$GITHUB_RUN_NUMBER"
          else
            release_version="$DISPATCH_VERSION"
            release_build="$DISPATCH_BUILD_NUMBER"
          fi
          echo "PICOO_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "PICOO_RELEASE_BUILD_NUMBER=$release_build" >> "$GITHUB_ENV"
      - name: Import Developer ID identity and release profiles
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_MACOS_HOST_PROFILE_BASE64: ${{ secrets.APPLE_MACOS_HOST_PROFILE_BASE64 }}
          APPLE_MACOS_EXTENSION_PROFILE_BASE64: ${{ secrets.APPLE_MACOS_EXTENSION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          release_dir="$RUNNER_TEMP/picoo-apple-release"
          keychain="$release_dir/picoo-signing.keychain-db"
          original_keychain="$(security default-keychain -d user | tr -d '"')"
          mkdir -p "$release_dir"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$release_dir/developer-id.p12"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 -D > "$release_dir/notary-key.p8"
          printf '%s' "$APPLE_MACOS_HOST_PROFILE_BASE64" | base64 -D > "$release_dir/host.provisionprofile"
          printf '%s' "$APPLE_MACOS_EXTENSION_PROFILE_BASE64" | base64 -D > "$release_dir/extension.provisionprofile"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security import "$release_dir/developer-id.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "$original_keychain"
          security find-identity -v -p codesigning "$keychain"
          echo "PICOO_RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
          echo "PICOO_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "PICOO_ORIGINAL_KEYCHAIN=$original_keychain" >> "$GITHUB_ENV"
          echo "PICOO_NOTARY_KEY_PATH=$release_dir/notary-key.p8" >> "$GITHUB_ENV"
          echo "PICOO_MACOS_HOST_PROFILE_PATH=$release_dir/host.provisionprofile" >> "$GITHUB_ENV"
          echo "PICOO_MACOS_EXTENSION_PROFILE_PATH=$release_dir/extension.provisionprofile" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and staple macOS app
        env:
          PICOO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PICOO_MACOS_SIGNING_IDENTITY: ${{ secrets.APPLE_MACOS_SIGNING_IDENTITY }}
          PICOO_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          PICOO_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: cargo run -p xtask -- release macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-app-signed-notarized
          path: target/apple/PicooCamera-macOS.zip
          if-no-files-found: error
      - name: Remove temporary Apple release credentials
        if: always()
        run: |
          expected_release_dir="$RUNNER_TEMP/picoo-apple-release"
          release_keychain="${PICOO_RELEASE_KEYCHAIN:-$expected_release_dir/picoo-signing.keychain-db}"
          if [[ -n "${PICOO_ORIGINAL_KEYCHAIN:-}" ]]; then
            security list-keychains -d user -s "$PICOO_ORIGINAL_KEYCHAIN" || true
          fi
          if [[ -f "$release_keychain" ]]; then
            security delete-keychain "$release_keychain" || true
          fi
          if [[ -d "$expected_release_dir" ]]; then
            rm -rf -- "$expected_release_dir"
          fi

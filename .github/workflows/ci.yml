name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  rust-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add rustfmt clippy
      - run: bash .cursor/install.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash scripts/check-docs.sh
      - run: cargo run -p xtask -- test linux
      - run: cargo run -p xtask -- test protocol

  android:
    runs-on: ubuntu-latest
    needs: rust-and-docs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: PICOO_INSTALL_ANDROID=1 bash .cursor/install.sh
      - run: echo "sdk.dir=${ANDROID_HOME}" >> apps/android/local.properties
      - run: cargo run -p xtask -- build android
      - name: Android unit tests
        run: ./apps/android/gradlew -p apps/android testDebugUnitTest
      - run: cargo run -p xtask -- package android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: apps/android/app/build/outputs/apk/debug/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            apps/android/app/build/outputs/apk/release/
            apps/android/app/build/outputs/bundle/release/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: rust-and-docs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install WiX v5
        shell: pwsh
        run: |
          # Pin WiX 5.x: avoids WiX 7 OSMF EULA (WIX7015) on clean CI agents.
          dotnet tool install --global wix --version 5.0.2 --verbosity quiet
          $tools = Join-Path $env:USERPROFILE ".dotnet\tools"
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          $env:Path = "$tools;$env:Path"
          wix --version
          wix extension add WixToolset.Firewall.wixext/5.0.2
      - run: cargo run -p xtask -- build windows
      - name: Package Windows + MSI
        env:
          PICOO_REQUIRE_MSI: "1"
        run: cargo run -p xtask -- package windows
      - name: Verify Windows bundle smoke (VCAM-001)
        shell: pwsh
        run: ./scripts/verify_windows_bundle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            target/release/bundle/
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: target/release/bundle/msi/PicooCamera.msi
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  rust-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add rustfmt clippy
      - run: bash .cursor/install.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash scripts/check-docs.sh
      - run: cargo run -p xtask -- test linux
      - run: cargo run -p xtask -- test protocol

  android:
    runs-on: ubuntu-latest
    needs: rust-and-docs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: PICOO_INSTALL_ANDROID=1 bash .cursor/install.sh
      - run: echo "sdk.dir=${ANDROID_HOME}" >> apps/android/local.properties
      - run: cargo run -p xtask -- build android
      - run: cargo run -p xtask -- package android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: apps/android/app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            apps/android/app/build/outputs/apk/release/
            apps/android/app/build/outputs/bundle/release/

  windows:
    runs-on: windows-latest
    needs: rust-and-docs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo run -p xtask -- build windows
      - run: cargo run -p xtask -- package windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: target/release/bundle/
          if-no-files-found: warn

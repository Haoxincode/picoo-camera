name: Android Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Monotonically increasing Android versionCode
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve release build identity
        env:
          DISPATCH_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          workspace_version="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$workspace_version"
            build_number="$GITHUB_RUN_NUMBER"
          else
            build_number="$DISPATCH_BUILD_NUMBER"
          fi
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          echo "PICOO_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
      - name: Install pinned Android toolchain
        run: PICOO_INSTALL_ANDROID=1 bash .cursor/install.sh
      - name: Point Gradle at installed SDK
        run: |
          source apps/android/toolchain.properties
          test -d "${ANDROID_HOME}/ndk/${PICOO_ANDROID_NDK_VERSION}"
          echo "sdk.dir=${ANDROID_HOME}" > apps/android/local.properties
          bash scripts/check_android_toolchain.sh
      - name: Materialize protected release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          release_dir="$RUNNER_TEMP/picoo-android-release"
          mkdir -p "$release_dir"
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$release_dir/release.keystore"
          echo "PICOO_ANDROID_KEYSTORE_PATH=$release_dir/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed APK and AAB
        env:
          PICOO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PICOO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PICOO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cargo run -p xtask -- package android
      - name: Verify signer, package identity, and versions
        env:
          PICOO_ANDROID_SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
        run: bash scripts/verify_android_release.sh
      - name: Remove Android release credentials before third-party artifact processing
        run: rm -rf -- "$RUNNER_TEMP/picoo-android-release"
      - name: Generate SPDX SBOM for release artifacts
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          path: apps/android/app/build/outputs
          format: spdx-json
          output-file: target/android-release.spdx.json
      - name: Attest APK and AAB provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-signed-release
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
            target/android-release.spdx.json
          if-no-files-found: error
      - name: Remove temporary Android release credentials
        if: always()
        run: |
          release_dir="$RUNNER_TEMP/picoo-android-release"
          if [[ -d "$release_dir" ]]; then
            rm -rf -- "$release_dir"
          fi

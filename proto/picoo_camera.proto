syntax = "proto3";

package picoo.camera;

// PCP control messages — transported inside ControlEnvelope over QUIC reliable
// streams. The repository owns both endpoints and intentionally carries no
// legacy wire-version negotiation.
// See ARCH-PICOO-PROTOCOL-001.

message ControlEnvelope {
  uint64 message_id = 1;
  uint64 connection_generation = 2;

  oneof payload {
    ClientHello client_hello = 10;
    ServerHello server_hello = 11;
    Capabilities capabilities = 12;
    PairingConfirm pairing_confirm = 14;
    PairingApproval pairing_approval = 15;
    PairingCommit pairing_commit = 16;
    PairingComplete pairing_complete = 17;
    StreamConfig stream_config = 20;
    StartStream start_stream = 21;
    StopStream stop_stream = 22;
    CameraCommand camera_command = 30;
    EncoderCommand encoder_command = 31;
    RequestKeyframe request_keyframe = 32;
    ReceiverStats receiver_stats = 40;
    SenderStats sender_stats = 41;
    Heartbeat heartbeat = 42;
    ClockSyncPing clock_sync_ping = 43;
    ClockSyncPong clock_sync_pong = 44;
    SessionError session_error = 50;
  }
}

message ClientHello {
  string sender_id = 1;
  string device_name = 2;
  bytes public_key = 3;
  bytes sender_nonce = 4;
}

message ServerHello {
  string receiver_id = 1;
  string display_name = 2;
  bytes public_key = 3;
  bool pairing_required = 4;
  bytes receiver_nonce = 5;
  bytes transcript_hash = 6;
  bytes identity_signature = 7;
}

message PairingConfirm {
  bytes transcript_hash = 1;
  bytes identity_signature = 2;
}

// Receiver -> Sender after local policy and Sender proof both succeed.
message PairingApproval {
  bytes transcript_hash = 1;
  bytes identity_signature = 2;
}

// Sender -> Receiver after the Sender durably stores Receiver trust.
message PairingCommit {
  bytes transcript_hash = 1;
  bytes identity_signature = 2;
}

// Receiver -> Sender after the Receiver durably stores Sender trust.
message PairingComplete {
  bytes transcript_hash = 1;
  bytes identity_signature = 2;
}

message Capabilities {
  repeated string codecs = 1;
  repeated Resolution resolutions = 2;
  repeated uint32 fps = 3;
  bool front_camera = 4;
  bool back_camera = 5;
}

message Resolution {
  uint32 width = 1;
  uint32 height = 2;
}

message StreamConfig {
  string codec = 1;
  string profile = 2;
  string level = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 fps = 6;
  uint32 bitrate = 7;
  uint32 rotation = 8;
  bool mirrored = 9;
  string color_range = 10;
  bytes sps = 11;
  bytes pps = 12;
  uint32 stream_epoch = 13;
}

message StartStream {}
message StopStream {}

message CameraCommand {
  enum Command {
    COMMAND_UNSPECIFIED = 0;
    SWITCH_FRONT = 1;
    SWITCH_BACK = 2;
    SET_RESOLUTION = 3;
    SET_MIRROR = 4;
    // Toggle from the Sender's actual active lens; avoids Receiver-side state drift.
    SWITCH_CAMERA = 5;
  }
  Command command = 1;
  Resolution resolution = 2;
  bool mirrored = 3;
}

message EncoderCommand {
  enum Command {
    COMMAND_UNSPECIFIED = 0;
    REQUEST_KEYFRAME = 1;
  }
  Command command = 1;
}

message ReceiverStats {
  double rtt_ms = 1;
  double packet_loss = 2;
  double jitter_ms = 3;
  uint64 reassembly_drop = 4;
  uint64 decoder_drop = 5;
  double frame_age_ms = 6;
  uint32 receive_bitrate = 7;
  double jitter_buffer_target_ms = 8;
  double jitter_buffer_actual_delay_ms = 9;
  double jitter_buffer_occupancy_ms = 10;
  // Missing fragments before successful Reed-Solomon recovery. FEC adapts
  // from this value; ABR continues to use residual packet_loss above.
  double pre_fec_packet_loss = 11;
  optional double capture_to_encode_ms = 12;
  optional double encode_to_arrival_ms = 13;
  optional double jitter_residence_ms = 14;
  optional double decode_ms = 15;
  optional double frame_publish_age_ms = 16;
  optional double end_to_end_latency_ms = 17;
  optional double clock_uncertainty_ms = 18;
}

// Sender -> Receiver transport observability. This travels on the reliable
// control stream so desktop diagnostics can distinguish Sender backpressure
// from loss after a Datagram entered QUIC.
message SenderStats {
  uint64 access_units = 1;
  uint64 submitted_datagrams = 2;
  double video_queue_age_ms = 3;
  uint64 video_dropped_access_units = 4;
  uint64 quic_lost_packets = 5;
  uint64 quic_sent_packets = 6;
  uint64 video_buffered_bytes = 7;
}

message RequestKeyframe {}
message Heartbeat {}

// Receiver-initiated four-timestamp exchange over the authenticated control
// stream. All timestamps are endpoint-local monotonic microseconds.
message ClockSyncPing {
  uint64 sample_id = 1;
  uint64 receiver_send_us = 2;
  uint32 stream_epoch = 3;
}

message ClockSyncPong {
  uint64 sample_id = 1;
  uint64 receiver_send_us = 2;
  uint64 sender_receive_us = 3;
  uint64 sender_send_us = 4;
  uint32 stream_epoch = 5;
}

message SessionError {
  string code = 1;
  string message = 2;
}

[package]
name = "picoo-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.12.1"
picoo-bitstream = { path = "../crates/picoo-bitstream" }
libfuzzer-sys = "0.4"
picoo-packet = { path = "../crates/picoo-packet" }
picoo-pairing = { path = "../crates/picoo-pairing" }
picoo-protocol = { path = "../crates/picoo-protocol" }

[workspace]

[[bin]]
name = "video-packet-decode"
path = "fuzz_targets/video_packet_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control-envelope"
path = "fuzz_targets/control_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing-transcript"
path = "fuzz_targets/pairing_transcript.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassembly-fec"
path = "fuzz_targets/reassembly_fec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec-bitstream"
path = "fuzz_targets/codec_bitstream.rs"
test = false
doc = false
bench = false

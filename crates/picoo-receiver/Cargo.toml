[package]
name = "picoo-receiver"
description = "Windows/macOS receiver pipeline: QUIC → decoder worker → LatestFrameStore"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The Windows desktop binary must enable Media Foundation through this
# dependency edge; a separate picoo-media-decode build cannot affect it.
windows-mf = ["picoo-media-decode/windows-mf"]

[dependencies]
bytes.workspace = true
picoo-frame-hub.workspace = true
picoo-jitter.workspace = true
picoo-media-decode.workspace = true
picoo-metrics.workspace = true
picoo-packet.workspace = true
picoo-pairing.workspace = true
picoo-protocol.workspace = true
picoo-session.workspace = true
picoo-sender.workspace = true
picoo-transport.workspace = true
prost.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[dev-dependencies]
picoo-discovery.workspace = true
picoo-protocol.workspace = true
picoo-sender.workspace = true
picoo-testkit.workspace = true
tempfile = "3.14"

[target.'cfg(all(not(windows), not(target_vendor = "apple")))'.dev-dependencies]
openh264 = { version = "0.9", default-features = true }

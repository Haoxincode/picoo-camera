[package]
name = "picoo-media-decode"
description = "Native AVC/HEVC access-unit decoder — ARCH-PICOO-MEDIA-002"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Explicit test/diagnostic dependency only; never a production codec fallback.
test-codecs = ["dep:openh264", "picoo-gpu/test-support"]
windows-mf = ["dep:picoo-gpu"]

[dependencies]
bytes.workspace = true
picoo-frame-hub.workspace = true
picoo-bitstream.workspace = true
picoo-protocol.workspace = true
thiserror.workspace = true
tracing = "0.1"

[target.'cfg(all(not(windows), not(target_vendor = "apple")))'.dependencies]
openh264 = { version = "0.9", default-features = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "std",
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = [
    "std",
    "VTDecompressionProperties",
    "VTDecompressionSession",
    "VTErrors",
    "objc2-core-media",
    "objc2-core-video",
] }

[target.'cfg(windows)'.dependencies]
picoo-gpu = { workspace = true, optional = true }
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[dev-dependencies]
picoo-testkit.workspace = true

[target.'cfg(all(not(windows), not(target_vendor = "apple")))'.dev-dependencies]
openh264 = { version = "0.9", default-features = true }

[target.'cfg(windows)'.dev-dependencies]
picoo-gpu = { workspace = true, features = ["test-support"] }
